<head>

  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(8, 13, 21, 0.88);
      --border: rgba(0, 240, 255, 0.38);
      --accent: #00F0FF;
      --accent2: #FF2A85;
      --accent3: #FCEE09;
      --text: #EBF9FF;
      --muted: #7B9BB0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #0f1b29 0%, #040609 100%);
      color: var(--text);
      font-family: "JetBrains Mono", "Cascadia Mono", "Consolas", "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 14px 26px;
      gap: 10px;
      user-select: none;
    }

    .topbar, .controls-bar {
      width: 100%;
      max-width: 1160px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 10px var(--accent2);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .group-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .group-label {
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.07em;
      margin-right: 2px;
      text-transform: uppercase;
    }

    .btn {
      background: rgba(0, 240, 255, 0.05);
      color: var(--text);
      border: 1px solid rgba(0, 240, 255, 0.28);
      padding: 6px 10px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(0, 240, 255, 0.14);
    }

    .btn.active {
      background: var(--accent);
      color: #03090d;
      border-color: var(--accent);
      font-weight: 700;
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
    }

    .btn.pink.active {
      background: var(--accent2);
      color: #ffffff;
      border-color: var(--accent2);
      box-shadow: 0 0 14px rgba(255, 42, 133, 0.45);

    .btn.gold.active {
      background: var(--accent3);
      color: #090800;
      border-color: var(--accent3);
      box-shadow: 0 0 14px rgba(252, 238, 9, 0.45);
    }

    .viewport-wrap {
      position: relative;
      width: 100%;
      max-width: 1160px;
      display: flex;
      justify-content: center;
      background: #030508;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.75);
    }

    canvas#mainCanvas {
      width: 100%;
      max-width: 1080px;
      height: auto;
      aspect-ratio: 1080 / 720;
      display: block;
      border-radius: 3px;
      cursor: grab;
      background: #05080d;
      touch-action: none;
    }

    canvas#mainCanvas:active {
      cursor: grabbing;
    }

    .footer-bar {
      width: 100%;
      max-width: 1160px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      padding: 2px 4px;
    }

    .hint-highlight {
      color: var(--accent3);
      font-weight: 600;
    }
  </style>

    const STAGE_NAMES = [

    const STAGE_SUBS = [
      ['BIOMETRIC LOCK-ON', '360° ORBITAL TELEMETRY'],
      ['SKELETAL RIGGING MESH', 'DAMAGE MULTIPLIER ZONES'],
      ['CHASSIS CHROMATIC SWAPS', 'ARMOR PLATING & MATERIALS'],

    // Interactive State
    let currentSkinIdx = 0;
    let currentWeaponIdx = 0;
    let currentLevel = 50;
    let stageMode = 'auto';
    let isPlaying = true;
    let startTime = performance.now();
    let pausedElapsed = 0;

    // 3D Camera & Mouse Orbit State
    let yaw = 0.45;
    let pitch = 0.10;
    let zoom = 1.0;
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let lastInteractionTime = -99999;

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      lastInteractionTime = performance.now();
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastMouseX;
      const dy = e.clientY - lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      yaw += dx * 0.011;
      pitch = Math.max(-0.35, Math.min(0.48, pitch + dy * 0.007));
      lastInteractionTime = performance.now();
    });

    canvas.addEventListener('pointerup', () => { isDragging = false; });
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom = Math.max(0.75, Math.min(1.45, zoom - e.deltaY * 0.0008));
      lastInteractionTime = performance.now();
    }, { passive: false });

    // Web Audio API Sound Synth
    let soundEnabled = false;
    let audioCtx = null;
    let lastStageSound = -1;

    function playStageBeep(freq = 640) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.35, now + 0.08);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.10);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.11);
    }

    // -------------------------------------------------------------
    // SELF-CONTAINED 3D GEOMETRY & RASTER ENGINE (Zero External Deps)
    // -------------------------------------------------------------
    function createBox(cx, cy, cz, sx, sy, sz, matType, groupTag = 'base', rz = 0, rx = 0, ry = 0) {
      const hx = sx / 2, hy = sy / 2, hz = sz / 2;
      const rawVerts = [
        [-hx, -hy, -hz], [hx, -hy, -hz], [hx, hy, -hz], [-hx, hy, -hz],
        [-hx, -hy,  hz], [hx, -hy,  hz], [hx, hy,  hz], [-hx, hy,  hz]
      ];
      const cosZ = Math.cos(rz), sinZ = Math.sin(rz);
      const cosX = Math.cos(rx), sinX = Math.sin(rx);
      const cosY = Math.cos(ry), sinY = Math.sin(ry);

      const verts = rawVerts.map(([vx, vy, vz]) => {
        // Rotate Z
        let x1 = vx * cosZ - vy * sinZ;
        let y1 = vx * sinZ + vy * cosZ;
        let z1 = vz;
        // Rotate X
        let y2 = y1 * cosX - z1 * sinX;
        let z2 = y1 * sinX + z1 * cosX;
        let x2 = x1;
        // Rotate Y
        let x3 = x2 * cosY + z2 * sinY;
        let z3 = -x2 * sinY + z2 * cosY;
        return [x3 + cx, y2 + cy, z3 + cz];
      });

      const faces = [
        [0, 1, 2, 3], // Back
        [5, 4, 7, 6], // Front
        [4, 0, 3, 7], // Left
        [1, 5, 6, 2], // Right
        [3, 2, 6, 7], // Top
        [4, 5, 1, 0]  // Bottom
      ];
      return { verts, faces, matType, groupTag };
    }

    function buildCharacterMeshes(tSec) {
      const meshes = [];
      const bob = Math.sin(tSec * 2.8) * 0.025;
      const swing = Math.sin(tSec * 2.8) * 0.04;

      // Boots & Lower Legs
      [-0.21, 0.21].forEach((lx, sideIdx) => {
        const sDir = sideIdx === 0 ? 1 : -1;
        // Cyber Boot
        meshes.push(createBox(lx, 0.06, 0.04, 0.16, 0.11, 0.29, 'primary'));
        meshes.push(createBox(lx, 0.02, 0.05, 0.17, 0.03, 0.30, 'neon'));
        // Shin Armor
        meshes.push(createBox(lx, 0.33, 0.0, 0.15, 0.42, 0.17, 'primary'));
        meshes.push(createBox(lx, 0.34, 0.09, 0.06, 0.32, 0.02, 'neon'));
        // Knee Pad
        meshes.push(createBox(lx, 0.56 + bob * 0.4, 0.04, 0.14, 0.11, 0.16, 'neon'));
        // Thigh Armor
        meshes.push(createBox(lx, 0.80 + bob * 0.6, 0.0, 0.19, 0.38, 0.20, 'secondary', 'base', sDir * 0.03));
      });

      // Pelvis & Tactical Belt
      meshes.push(createBox(0, 1.04 + bob, 0, 0.50, 0.16, 0.26, 'secondary'));
      meshes.push(createBox(0, 1.04 + bob, 0.135, 0.16, 0.12, 0.04, 'neon'));

      // Lower & Upper Torso (Chestplate)
      meshes.push(createBox(0, 1.24 + bob, 0, 0.42, 0.24, 0.26, 'secondary'));
      meshes.push(createBox(0, 1.48 + bob, 0.01, 0.56, 0.32, 0.31, 'primary'));
      // Glowing Graphene Chest Core Reactor
      meshes.push(createBox(0, 1.48 + bob, 0.17, 0.18, 0.14, 0.04, 'neon'));
      // Spine Cyberware Vertebrae on Back
      for (let s = 0; s < 4; s++) {
        meshes.push(createBox(0, 1.24 + s * 0.10 + bob, -0.16, 0.08, 0.06, 0.04, 'neon'));
      }
      // High Collar
      meshes.push(createBox(0, 1.67 + bob, -0.03, 0.34, 0.10, 0.26, 'secondary'));

      // Cybernetic Helmet & Visor
      meshes.push(createBox(0, 1.84 + bob, 0.0, 0.27, 0.29, 0.29, 'primary'));
      meshes.push(createBox(0, 1.85 + bob, 0.135, 0.285, 0.085, 0.07, 'neon')); // Glowing Visor
      meshes.push(createBox(0, 2.00 + bob, -0.01, 0.07, 0.07, 0.31, 'secondary')); // Crest

      // Left Arm
      meshes.push(createBox(-0.37, 1.54 + bob, 0, 0.16, 0.16, 0.16, 'secondary'));
      meshes.push(createBox(-0.42, 1.32 + bob, 0.02, 0.13, 0.30, 0.14, 'primary', 'base', 0.12, -0.15 + swing));
      meshes.push(createBox(-0.45, 1.06 + bob, 0.12, 0.12, 0.28, 0.13, 'secondary', 'base', 0.05, -0.45 + swing));
      meshes.push(createBox(-0.46, 1.06 + bob, 0.19, 0.03, 0.22, 0.03, 'neon', 'base', 0.05, -0.45 + swing));

      // Right Arm (Weapon Arm extended forward)
      meshes.push(createBox(0.37, 1.54 + bob, 0, 0.16, 0.16, 0.16, 'secondary'));
      meshes.push(createBox(0.42, 1.34 + bob, 0.08, 0.13, 0.28, 0.14, 'primary', 'base', -0.10, -0.45));
      meshes.push(createBox(0.44, 1.15 + bob, 0.28, 0.12, 0.28, 0.13, 'secondary', 'base', -0.05, -1.15));

      // Weapon Meshes attached to Right Hand (0.44, 1.12 + bob, 0.45)
      const wx = 0.44, wy = 1.13 + bob, wz = 0.58;
      if (currentWeaponIdx === 0) {
        // Weapon 0: Plasma Assault Rifle
        meshes.push(createBox(wx, wy, wz + 0.12, 0.09, 0.17, 0.76, 'primary', 'weapon'));
        meshes.push(createBox(wx, wy + 0.04, wz + 0.38, 0.045, 0.045, 0.48, 'neon', 'weapon'));
        meshes.push(createBox(wx, wy + 0.12, wz + 0.06, 0.065, 0.07, 0.24, 'neon', 'weapon')); // Scope
        meshes.push(createBox(wx, wy - 0.14, wz + 0.15, 0.07, 0.19, 0.11, 'secondary', 'weapon', 0, 0.25));
      } else if (currentWeaponIdx === 1) {
        // Weapon 1: Thermal Katana
        meshes.push(createBox(wx, wy - 0.02, wz - 0.10, 0.045, 0.045, 0.28, 'secondary', 'weapon', 0, -0.25));
        meshes.push(createBox(wx, wy + 0.02, wz + 0.04, 0.11, 0.11, 0.03, 'primary', 'weapon', 0, -0.25));
        meshes.push(createBox(wx, wy + 0.18, wz + 0.52, 0.024, 0.055, 0.98, 'neon', 'weapon', 0, -0.25));
      } else {
        // Weapon 2: Heavy EM-Railgun
        meshes.push(createBox(wx, wy + 0.02, wz + 0.18, 0.15, 0.23, 0.92, 'secondary', 'weapon'));
        meshes.push(createBox(wx - 0.05, wy + 0.06, wz + 0.48, 0.035, 0.05, 1.15, 'neon', 'weapon'));
        meshes.push(createBox(wx + 0.05, wy + 0.06, wz + 0.48, 0.035, 0.05, 1.15, 'neon', 'weapon'));
        meshes.push(createBox(wx, wy + 0.16, wz + 0.12, 0.08, 0.08, 0.32, 'neon', 'weapon'));
      }

      // LEVEL >= 50 UPGRADES: Heavy Shoulder Pauldrons & Helmet Antenna
      if (currentLevel >= 50) {
        meshes.push(createBox(-0.46, 1.66 + bob, 0, 0.24, 0.16, 0.34, 'primary', 'lvl50', 0.28));
        meshes.push(createBox(-0.47, 1.73 + bob, 0, 0.25, 0.04, 0.35, 'neon', 'lvl50', 0.28));
        meshes.push(createBox(0.46, 1.66 + bob, 0, 0.24, 0.16, 0.34, 'primary', 'lvl50', -0.28));
        meshes.push(createBox(0.47, 1.73 + bob, 0, 0.25, 0.04, 0.35, 'neon', 'lvl50', -0.28));
        meshes.push(createBox(-0.15, 2.08 + bob, -0.05, 0.025, 0.28, 0.025, 'neon', 'lvl50'));
      }

      // LEVEL 100 UPGRADES: Cybernetic Energy Wings, Halo & Orbital Combat Drone
      if (currentLevel >= 100) {
        [-1, 1].forEach((dir) => {
          for (let w = 0; w < 3; w++) {
            meshes.push(createBox(
              dir * (0.55 + w * 0.14),
              1.66 - w * 0.17 + bob,
              -0.22,
              0.56 - w * 0.10,
              0.055,
              0.035,
              'neon',
              'lvl100',
              dir * (0.36 - w * 0.18),
              0,
              dir * -0.25
            ));
          }
        });
        // Floating Cyber Crown Halo
        meshes.push(createBox(0, 2.16 + Math.sin(tSec * 4) * 0.03, 0, 0.38, 0.03, 0.38, 'neon', 'lvl100', 0, 0, tSec * 1.8));
        // Orbital Companion Drone
        const dAngle = tSec * 2.2;
        const dx = Math.cos(dAngle) * 0.82;
        const dz = Math.sin(dAngle) * 0.82;
        meshes.push(createBox(dx, 1.86 + Math.sin(tSec * 5) * 0.06, dz, 0.16, 0.16, 0.16, 'neon', 'lvl100', tSec * 2, tSec * 2));
      }

      return meshes;
    }

    // 3D Projection Math
    function projectPoint3D(pt, cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale) {
      const [x, y, z] = pt;
      // Rotate Yaw around Y axis
      const x1 = x * cosY + z * sinY;
      const z1 = -x * sinY + z * cosY;
      const y1 = y - 1.05; // Center vertically around character waist/chest

      // Rotate Pitch around X axis
      const y2 = y1 * cosP - z1 * sinP;
      const z2 = y1 * sinP + z1 * cosP;

      const fov = 4.2;
      const depth = fov / (fov + z2 + 0.5);
      const sx = camFocusX + x1 * depth * scale;
      const sy = camFocusY - y2 * depth * scale;
      return [sx, sy, z2];
    }

    function rgba(rgb, a) {
      return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
    }

    function drawCornerBox(x, y, w, h, color, len = 12, lw = 1.6) {
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.beginPath();
      ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
      ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
      ctx.moveTo(x + w, y + h - len); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w - len, y + h);
      ctx.moveTo(x + len, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h - len);
      ctx.stroke();
    }

    function drawPanel(x, y, w, h, rgb) {
      ctx.fillStyle = 'rgba(6, 11, 18, 0.85)';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = rgba(rgb, 0.42);
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }

    function drawRadarChart(cx, cy, radius, values, labels, rgb) {
      const n = values.length;
      ctx.save();
      for (let r = 0.33; r <= 1.01; r += 0.33) {
        ctx.strokeStyle = rgba(rgb, 0.24);
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const ang = -Math.PI / 2 + (i * Math.PI * 2) / n;
          const px = cx + Math.cos(ang) * radius * r;
          const py = cy + Math.sin(ang) * radius * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }
      ctx.fillStyle = rgba(rgb, 0.28);
      ctx.strokeStyle = rgba(rgb, 0.95);
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < n; i++) {
        const ang = -Math.PI / 2 + (i * Math.PI * 2) / n;
        const px = cx + Math.cos(ang) * radius * values[i];
        const py = cy + Math.sin(ang) * radius * values[i];
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#EBF9FF';
      ctx.font = 'bold 10.5px monospace';
      for (let i = 0; i < n; i++) {
        const ang = -Math.PI / 2 + (i * Math.PI * 2) / n;
        const lx = cx + Math.cos(ang) * (radius + 22) - 14;
        const ly = cy + Math.sin(ang) * (radius + 16) + 4;
        ctx.fillText(labels[i], lx, ly);
      }
      ctx.restore();
    }

    function applySkin(idx) {
      currentSkinIdx = idx;
      document.querySelectorAll('#skinRow .btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });
    }

    function applyWeapon(idx) {
      currentWeaponIdx = idx;
      document.querySelectorAll('#weaponRow .btn').forEach((b, i) => {
        b.classList.toggle('active', i === idx);
      });
    }

    function applyLevel(lvl) {
      currentLevel = lvl;
      document.querySelectorAll('#levelRow .btn').forEach((b) => {
        b.classList.toggle('active', parseInt(b.dataset.level, 10) === lvl);
      });
    }

    function renderFrame(now) {
      let elapsed;
      if (isPlaying) {
        elapsed = ((now - startTime) / 1000) % LOOP_DURATION;
        pausedElapsed = elapsed;
      } else {
        elapsed = pausedElapsed;
      }

      let stageIdx = Math.min(5, Math.floor(elapsed / 3.0));
      let stageProg = (elapsed - stageIdx * 3.0) / 3.0;

      if (stageMode !== 'auto') {
        stageIdx = parseInt(stageMode, 10);
        stageProg = ((now / 1000) % 3.0) / 3.0;
      } else if (isPlaying) {
        // Automatic cycling of Skins in Stage 2, Weapons in Stage 3, Levels in Stage 4
        if (stageIdx === 2) {
          const autoSkin = Math.min(2, Math.floor(stageProg * 3));
          if (autoSkin !== currentSkinIdx) applySkin(autoSkin);
        } else if (stageIdx === 3) {
          const autoWep = Math.min(2, Math.floor(stageProg * 3));
          if (autoWep !== currentWeaponIdx) applyWeapon(autoWep);
        } else if (stageIdx === 4) {
          const lvls = [1, 50, 100];
          const autoLvl = lvls[Math.min(2, Math.floor(stageProg * 3))];
          if (autoLvl !== currentLevel) applyLevel(autoLvl);
        }
      }

      if (stageIdx !== lastStageSound) {
        lastStageSound = stageIdx;
        playStageBeep(520 + stageIdx * 90);
      }

      // Automatic 360 Turntable Rotation when user is not dragging mouse
      const userRecentlyDragged = (now - lastInteractionTime) < 2800;
      if (!isDragging && !userRecentlyDragged && isPlaying) {
        if (stageIdx === 3) {
          // Angle character to showcase weapon in Stage 3
          const targetYaw = -0.65 + Math.sin(now * 0.002) * 0.28;
          yaw += (targetYaw - yaw) * 0.08;
        } else {
          yaw = (yaw + 0.018) % (Math.PI * 2);
        }
      }

      const skin = SKINS[currentSkinIdx];
      const wep = WEAPONS[currentWeaponIdx];
      const lvlObj = LEVELS[currentLevel];
      const acc = skin.glowHex;
      const rgb = skin.glowRgb;

      // Clear & Draw Background Cyber Grid
      ctx.fillStyle = '#05080e';
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = rgba(rgb, 0.075);
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x < W; x += 36) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
      for (let y = 0; y < H; y += 36) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
      ctx.stroke();

      // Camera parameters
      const camFocusX = stageIdx === 3 ? 470 : 510;
      const camFocusY = stageIdx === 3 ? 385 : 375;
      const scale = (stageIdx === 3 ? 275 : 235) * zoom;
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

      // Draw 3D Turntable Holographic Rings under feet
      ctx.save();
      for (let rIdx = 0; rIdx < 2; rIdx++) {
        const radius = rIdx === 0 ? 0.92 : 1.12;
        ctx.strokeStyle = rgba(rgb, rIdx === 0 ? 0.65 : 0.32);
        ctx.lineWidth = rIdx === 0 ? 2 : 1.2;
        ctx.beginPath();
        for (let s = 0; s <= 48; s++) {
          const a = (s / 48) * Math.PI * 2 + now * 0.001 * (rIdx === 0 ? 1 : -1);
          const px = Math.cos(a) * radius;
          const pz = Math.sin(a) * radius;
          const [sx, sy] = projectPoint3D([px, 0, pz], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
          if (s === 0) ctx.moveTo(sx, sy);
          else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
      }
      ctx.restore();

      // Build & Painter's-Algorithm Sort 3D Character Faces
      const tSec = now * 0.001;
      const meshes = buildCharacterMeshes(tSec);
      const drawList = [];

      for (const m of meshes) {
        const projVerts = m.verts.map(v => projectPoint3D(v, cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale));
        for (const f of m.faces) {
          const v0 = projVerts[f[0]], v1 = projVerts[f[1]], v2 = projVerts[f[2]], v3 = projVerts[f[3]];
          const avgZ = (v0[2] + v1[2] + v2[2] + v3[2]) * 0.25;
          // 2D Cross product for backface culling & directional shading
          const nx = (v1[0] - v0[0]) * (v2[1] - v0[1]) - (v1[1] - v0[1]) * (v2[0] - v0[0]);
          drawList.push({ v0, v1, v2, v3, avgZ, nx, matType: m.matType, groupTag: m.groupTag });
        }
      }

      // Sort back-to-front (largest Z is farthest)
      drawList.sort((a, b) => b.avgZ - a.avgZ);

      const isWireframe = (stageIdx === 1);

      for (const poly of drawList) {
        ctx.beginPath();
        ctx.moveTo(poly.v0[0], poly.v0[1]);
        ctx.lineTo(poly.v1[0], poly.v1[1]);
        ctx.lineTo(poly.v2[0], poly.v2[1]);
        ctx.lineTo(poly.v3[0], poly.v3[1]);
        ctx.closePath();

        if (isWireframe) {
          ctx.fillStyle = poly.matType === 'neon' ? rgba(rgb, 0.28) : rgba(rgb, 0.05);
          ctx.fill();
          ctx.strokeStyle = poly.matType === 'neon' ? '#FFFFFF' : rgba(rgb, 0.55);
          ctx.lineWidth = 1;
          ctx.stroke();
        } else {
          const shade = Math.max(0.55, Math.min(1.35, 0.88 - poly.nx * 0.00025));
          if (poly.matType === 'neon') {
            ctx.fillStyle = acc;
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 0.8;
            ctx.stroke();
          } else {
            const baseCol = poly.matType === 'primary' ? skin.primary : skin.secondary;
            const r = Math.min(255, Math.round(baseCol[0] * shade));
            const g = Math.min(255, Math.round(baseCol[1] * shade));
            const b = Math.min(255, Math.round(baseCol[2] * shade));
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fill();
            ctx.strokeStyle = rgba(rgb, 0.32);
            ctx.lineWidth = 0.9;
            ctx.stroke();
          }
        }
      }

      // Project Key 3D Rig Landmarks for HUD Callouts
      const bob = Math.sin(tSec * 2.8) * 0.025;
      const pHead = projectPoint3D([0, 1.85 + bob, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pNeck = projectPoint3D([0, 1.66 + bob, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pShL  = projectPoint3D([-0.38, 1.54 + bob, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pShR  = projectPoint3D([0.38, 1.54 + bob, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pElL  = projectPoint3D([-0.44, 1.24 + bob, 0.08], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pElR  = projectPoint3D([0.44, 1.24 + bob, 0.18], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pWep  = projectPoint3D([0.44, 1.15 + bob, 0.72], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pCore = projectPoint3D([0, 1.44 + bob, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pPelv = projectPoint3D([0, 1.04 + bob, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pKnL  = projectPoint3D([-0.21, 0.56 + bob * 0.4, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pKnR  = projectPoint3D([0.21, 0.56 + bob * 0.4, 0], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pFtL  = projectPoint3D([-0.21, 0.06, 0.05], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);
      const pFtR  = projectPoint3D([0.21, 0.06, 0.05], cosY, sinY, cosP, sinP, camFocusX, camFocusY, scale);

      // STAGE 0: 360 TURNTABLE SCAN
      if (stageIdx === 0) {
        drawCornerBox(345, 92, 330, 545, acc, 22, 2);
        const deg = Math.round(((yaw * 180 / Math.PI) % 360 + 360) % 360);
        ctx.fillStyle = acc;
        ctx.font = 'bold 13px monospace';
        ctx.fillText(`TURNTABLE YAW // ${String(deg).padStart(3, '0')}°`, 432, 626);

        drawPanel(735, 118, 320, 215, rgb);
        ctx.fillStyle = acc;
        ctx.font = 'bold 14px monospace';
        ctx.fillText('UNIT TELEMETRY // LOCK', 753, 148);
        const rows = [
          ['OPERATIVE', 'V-09 // VALKYRIE'],
          ['CLASS', 'CYBER-VANGUARD'],
          ['CHASSIS', skin.name],
          ['ACTIVE LVL', `LVL ${currentLevel} (${lvlObj.powerScore} PWR)`],
          ['ROTATION', `${deg}° / 360° LIVE`]
        ];
        rows.forEach(([k, v], i) => {
          ctx.fillStyle = '#7B9BB0';
          ctx.font = '11.5px monospace';
          ctx.fillText(k, 753, 180 + i * 27);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(v, 855, 180 + i * 27);
        });
      }

      // STAGE 1: HITBOX & SKELETAL RIG
      else if (stageIdx === 1) {
        const bones = [
          [pHead, pNeck], [pNeck, pShL], [pNeck, pShR],
          [pShL, pElL], [pShR, pElR], [pElR, pWep],
          [pNeck, pCore], [pCore, pPelv],
          [pPelv, pKnL], [pPelv, pKnR],
          [pKnL, pFtL], [pKnR, pFtR]
        ];
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        bones.forEach(([a, b]) => { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); });
        ctx.stroke();

        [pHead, pNeck, pShL, pShR, pElL, pElR, pCore, pPelv, pKnL, pKnR, pFtL, pFtR].forEach(([jx, jy]) => {
          ctx.fillStyle = '#05080e';
          ctx.strokeStyle = acc;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(jx, jy, 4.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });

        drawCornerBox(pHead[0] - 42, pHead[1] - 42, 84, 78, '#FF2A85', 10, 1.8);
        ctx.fillStyle = '#FF2A85';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('CRIT HITBOX // 2.5x DMG', pHead[0] + 52, pHead[1] - 8);

        drawCornerBox(pCore[0] - 66, pCore[1] - 56, 132, 124, acc, 12, 1.5);
        ctx.fillStyle = acc;
        ctx.fillText('TORSO ARMOR // 1.0x DMG', pCore[0] + 74, pCore[1]);

        drawCornerBox(pKnL[0] - 45, pKnL[1] - 35, 140, 140, '#FCEE09', 10, 1.4);
        ctx.fillStyle = '#FCEE09';
        ctx.fillText('CYBER LIMBS // 0.75x DMG', pKnR[0] + 45, pKnR[1] + 20);

        drawPanel(735, 118, 320, 170, rgb);
        ctx.fillStyle = acc;
        ctx.font = 'bold 14px monospace';
        ctx.fillText('RIGGING & TOPOLOGY', 753, 148);
        ctx.fillStyle = '#EBF9FF';
        ctx.font = '12px monospace';
        ctx.fillText('BONE JOINTS: 13 ACTIVE NODES', 753, 180);
        ctx.fillText('WIREFRAME MESH: ENABLED', 753, 206);
        ctx.fillText('HEADSHOT MULTIPLIER: 250%', 753, 232);
        ctx.fillText('COLLISION CAPSULES: VERIFIED', 753, 258);
      }

      // STAGE 2: SUIT & SKINS
      else if (stageIdx === 2) {
        drawPanel(735, 118, 320, 360, rgb);
        ctx.fillStyle = acc;
        ctx.font = 'bold 14px monospace';
        ctx.fillText('CHASSIS & SKIN VARIANTS', 753, 148);
        ctx.fillStyle = '#7B9BB0';
        ctx.font = '11px monospace';
        ctx.fillText(skin.code, 753, 170);

        SKINS.forEach((sk, i) => {
          const y = 196 + i * 74;
          const isCur = (i === currentSkinIdx);
          ctx.fillStyle = isCur ? rgba(sk.glowRgb, 0.16) : 'rgba(255,255,255,0.03)';
          ctx.fillRect(750, y, 288, 60);
          ctx.strokeStyle = isCur ? sk.glowHex : 'rgba(255,255,255,0.12)';
          ctx.strokeRect(750.5, y + 0.5, 287, 59);

          ctx.fillStyle = sk.glowHex;
          ctx.fillRect(764, y + 16, 28, 28);

          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 12.5px monospace';
          ctx.fillText(sk.name, 804, y + 25);
          ctx.fillStyle = sk.glowHex;
          ctx.font = '11px monospace';
          ctx.fillText(`${sk.armorBonus} · ${sk.manufacturer}`, 804, y + 44);
        });

        const callouts = [
          [pHead, 'NEURAL VISOR // OPTIC MK.V', 320, 165],
          [pCore, 'GRAPHENE CHEST REACTOR', 320, 290],
          [pKnL, 'HYDRAULIC MYOMER GREAVES', 320, 465]
        ];
        callouts.forEach(([pt, label, lx, ly]) => {
          ctx.strokeStyle = rgba(rgb, 0.75);
          ctx.beginPath();
          ctx.moveTo(pt[0], pt[1]);
          ctx.lineTo(lx + 185, ly - 4);
          ctx.stroke();
          ctx.fillStyle = acc;
          ctx.font = 'bold 11.5px monospace';
          ctx.fillText(label, lx, ly);
        });
      }

      // STAGE 3: WEAPON ARSENAL
      else if (stageIdx === 3) {
        drawCornerBox(pWep[0] - 90, pWep[1] - 70, 180, 140, acc, 16, 2);

        drawPanel(725, 118, 330, 395, rgb);
        ctx.fillStyle = acc;
        ctx.font = 'bold 14px monospace';
        ctx.fillText('EQUIPPED WEAPON LOADOUT', 744, 148);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13.5px monospace';
        ctx.fillText(wep.name, 744, 180);
        ctx.fillStyle = '#FCEE09';
        ctx.font = '11.5px monospace';
        ctx.fillText(wep.type, 744, 200);

        const wStats = [
          ['DAMAGE RATING', wep.dmg],
          ['FIRE RATE', wep.rpm],
          ['EFFECTIVE RANGE', wep.range],
          ['AMMO / POWER', wep.ammo],
          ['SPECIAL PERK', wep.perk]
        ];
        wStats.forEach(([k, v], i) => {
          const sy = 236 + i * 32;
          ctx.fillStyle = '#7B9BB0';
          ctx.font = '11px monospace';
          ctx.fillText(k, 744, sy);
          ctx.fillStyle = '#FFFFFF';
          ctx.font = 'bold 12px monospace';
          ctx.fillText(v, 868, sy);
        });

        ctx.fillStyle = acc;
        ctx.font = 'bold 12px monospace';
        ctx.fillText('ATTACHED MODULES:', 744, 412);
        wep.parts.forEach((pt, i) => {
          ctx.fillStyle = '#EBF9FF';
          ctx.font = '11.5px monospace';
          ctx.fillText(`▸ ${pt}`, 744, 436 + i * 22);

          ctx.strokeStyle = rgba(rgb, 0.42);
          ctx.beginPath();
          ctx.moveTo(pWep[0], pWep[1]);
          ctx.lineTo(725, 432 + i * 22);
          ctx.stroke();
        });
      }

      // STAGE 4: LEVEL PROGRESSION (LVL 1 -> 50 -> 100)
      else if (stageIdx === 4) {
        drawPanel(725, 110, 330, 490, rgb);
        ctx.fillStyle = acc;
        ctx.font = 'bold 15px monospace';
        ctx.fillText(`LEVEL EVOLUTION // LVL ${currentLevel}`, 744, 140);
        ctx.fillStyle = '#FCEE09';
        ctx.font = 'bold 12px monospace';
        ctx.fillText(lvlObj.tier, 744, 162);

        const sRows = [
          ['HIT POINTS (HP)', lvlObj.hp],
          ['ATTACK POWER', lvlObj.atk],
          ['ARMOR DEFENSE', lvlObj.def],
          ['AGILITY / SPEED', lvlObj.spd],
          ['CRIT CHANCE', lvlObj.crit],
          ['COMBAT RATING', lvlObj.powerScore]
        ];
        sRows.forEach(([k, v], i) => {
          const ry = 194 + i * 26;
          ctx.fillStyle = '#7B9BB0';
          ctx.font = '11px monospace';
          ctx.fillText(k, 744, ry);
          ctx.fillStyle = i === 5 ? '#FCEE09' : '#FFFFFF';
          ctx.font = 'bold 12.5px monospace';
          ctx.fillText(String(v), 915, ry);
        });

        drawRadarChart(888, 468, 82, lvlObj.statsNorm, ['HP', 'ATK', 'DEF', 'SPD', 'TECH'], rgb);
      }

      // STAGE 5: HERO DOSSIER
      else if (stageIdx === 5) {
        const isGlitch = (stageMode === 'auto' && stageProg > 0.86);
        drawCornerBox(335, 88, 350, 548, acc, 26, 2.2);

        drawPanel(715, 118, 340, 420, rgb);
        ctx.fillStyle = '#FCEE09';
        ctx.font = 'bold 12px monospace';
        ctx.fillText('★★★ SSR LEGENDARY OPERATIVE ★★★', 735, 146);

        ctx.fillStyle = acc;
        ctx.font = 'bold 18px monospace';
        ctx.fillText(isGlitch ? 'ERR_0x99 // REBOOT' : 'TARGET LOCKED: V-09', 735, 174);

        const dRows = [
          ['CODENAME', 'VALKYRIE // V-09'],
          ['ACTIVE SKIN', skin.name],
          ['PRIMARY WEAPON', wep.name.slice(0, 20)],
          ['ASCENSION LEVEL', `LVL ${currentLevel}`],
          ['POWER RATING', lvlObj.powerScore],
          ['ULTIMATE SKILL', 'OVERCLOCK EMP NOVA'],
          ['DEPLOYMENT', 'READY // 99.9% SYNC']
        ];
        dRows.forEach(([k, v], i) => {
          const y = 214 + i * 38;
          ctx.fillStyle = '#7B9BB0';
          ctx.font = '11.5px monospace';
          ctx.fillText(k, 735, y);
          ctx.fillStyle = i >= 4 ? acc : '#FFFFFF';
          ctx.font = 'bold 12.5px monospace';
          ctx.fillText(v, 868, y);
        });

        if (isGlitch) {
          for (let g = 0; g < 8; g++) {
            const sy = Math.floor(Math.random() * (H - 40));
            const sh = Math.floor(10 + Math.random() * 26);
            const dx = Math.floor((Math.random() - 0.5) * 42);
            ctx.drawImage(canvas, 0, sy, W, sh, dx, sy, W, sh);
          }
        }
      }

      // Persistent HUD Chrome
      drawHUDChrome(elapsed, stageIdx, stageProg, skin, wep, lvlObj);

      requestAnimationFrame(renderFrame);
    }

    function drawHUDChrome(elapsed, stageIdx, stageProg, skin, wep, lvlObj) {
      const acc = skin.glowHex;
      const rgb = skin.glowRgb;

      // Top Header
      ctx.fillStyle = 'rgba(5, 8, 14, 0.84)';
      ctx.fillRect(0, 0, W, 74);
      ctx.strokeStyle = rgba(rgb, 0.38);
      ctx.beginPath();
      ctx.moveTo(22, 74);
      ctx.lineTo(W - 22, 74);
      ctx.stroke();

      ctx.fillStyle = '#FF2A85';
      ctx.beginPath();
      ctx.arc(36, 30, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('LIVE 3D RIG', 50, 35);
      ctx.fillStyle = acc;
      ctx.fillText('// CYBERPUNK CHARACTER SHOWCASE HUD', 152, 35);

      ctx.fillStyle = '#7B9BB0';
      ctx.font = '11px monospace';
      ctx.fillText(`SKIN: ${skin.name}   |   WEAPON: ${wep.name}   |   TIER: LVL ${currentLevel}`, 30, 58);

      const sec = Math.floor(elapsed);
      const ms = Math.floor((elapsed - sec) * 60);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 15px monospace';
      ctx.fillText(`00:00:${String(sec).padStart(2, '0')}:${String(ms).padStart(2, '0')}`, 885, 35);
      ctx.fillStyle = acc;
      ctx.font = '11px monospace';
      ctx.fillText('60 FPS / 3D ENGINE', 895, 58);

      // Left Stage Pipeline Panel
      drawPanel(24, 110, 275, 340, rgb);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 13.5px monospace';
      ctx.fillText('CHARACTER PIPELINE', 42, 142);
      ctx.fillStyle = '#7B9BB0';
      ctx.font = '11px monospace';
      ctx.fillText('UNIT V-09  /  INTERACTIVE 3D', 42, 162);

      STAGE_NAMES.forEach((st, i) => {
        const y = 196 + i * 36;
        if (i === stageIdx) {
          ctx.fillStyle = rgba(rgb, 0.16);
          ctx.fillRect(34, y - 17, 255, 26);
          ctx.strokeStyle = acc;
          ctx.strokeRect(34.5, y - 16.5, 254, 25);
        }
        ctx.fillStyle = i <= stageIdx ? '#FFFFFF' : '#698296';
        ctx.font = i === stageIdx ? 'bold 12.5px monospace' : '12.5px monospace';
        ctx.fillText(`0${i + 1}`, 44, y);
        ctx.fillText(st, 78, y);

        if (i < stageIdx) {
          ctx.fillStyle = acc;
          ctx.fillText('✓', 268, y);
        } else if (i === stageIdx) {
          ctx.fillStyle = '#FCEE09';
          ctx.fillRect(268, y - 8, 8, 8);
        }
      });

      const prog = stageMode === 'auto' ? (elapsed / LOOP_DURATION) : ((stageIdx + stageProg) / 6);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(42, 424, 238, 4);
      ctx.fillStyle = acc;
      ctx.fillRect(42, 424, 238 * Math.min(1, prog), 4);

      // Lower-left Stage Callout
      ctx.fillStyle = '#FCEE09';
      ctx.font = 'bold 12px monospace';
      ctx.fillText(`STAGE 0${stageIdx + 1} / 06`, 26, 495);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 21px monospace';
      ctx.fillText(STAGE_NAMES[stageIdx], 26, 526);
      ctx.fillStyle = '#7B9BB0';
      ctx.font = '11.5px monospace';
      ctx.fillText(STAGE_SUBS[stageIdx][0], 26, 552);
      ctx.fillText(STAGE_SUBS[stageIdx][1], 26, 572);

      // Bottom Status Bar
      ctx.fillStyle = 'rgba(5, 8, 14, 0.85)';
      ctx.fillRect(0, H - 48, W, 48);
      ctx.strokeStyle = rgba(rgb, 0.38);
      ctx.beginPath();
      ctx.moveTo(22, H - 48);
      ctx.lineTo(W - 22, H - 48);
      ctx.stroke();

      ctx.fillStyle = acc;
      ctx.font = 'bold 12.5px monospace';
      ctx.fillText(`OPERATIVE: V-09 VALKYRIE`, 28, H - 19);
      ctx.fillStyle = '#EBF9FF';
      ctx.fillText(`POWER SCORE: ${lvlObj.powerScore}   //   DRAG MOUSE TO ROTATE 360°`, 280, H - 19);
      ctx.fillStyle = '#FCEE09';
      ctx.fillText('NIGHT CITY MERCENARY ARCHIVE', 790, H - 19);
    }

    requestAnimationFrame(renderFrame);

    // UI Controls Wiring
    document.getElementById('stageRow').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-stage]');
      if (!btn) return;
      stageMode = btn.dataset.stage;
      document.querySelectorAll('#stageRow .btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });

    document.getElementById('skinRow').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-skin]');
      if (!btn) return;
      applySkin(parseInt(btn.dataset.skin, 10));
      playStageBeep(720);
    });

    document.getElementById('weaponRow').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-weapon]');
      if (!btn) return;
      applyWeapon(parseInt(btn.dataset.weapon, 10));
      playStageBeep(580);
    });

    document.getElementById('levelRow').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-level]');
      if (!btn) return;
      applyLevel(parseInt(btn.dataset.level, 10));
      playStageBeep(840);
    });

    const playPauseBtn = document.getElementById('playPauseBtn');
    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        startTime = performance.now() - pausedElapsed * 1000;
        playPauseBtn.textContent = '⏸ ПАУЗА';
      } else {
        playPauseBtn.textContent = '▶ ПУСК';
      }
    });

    const soundBtn = document.getElementById('soundBtn');
    soundBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔊 ЗВУК: ВКЛ' : '🔇 ЗВУК: ВЫКЛ';
      if (soundEnabled) playStageBeep(660);
    });

    const recordBtn = document.getElementById('recordBtn');
    recordBtn.addEventListener('click', () => {
      if (recordBtn.disabled) return;
      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'cyberpunk-character-hud.webm';
        a.click();
        recordBtn.disabled = false;
        recordBtn.textContent = '⏺ ЭКСПОРТ WEBM';
      };
      stageMode = 'auto';
      isPlaying = true;
      startTime = performance.now();
      recordBtn.disabled = true;
      recordBtn.textContent = '⏳ ЗАПИСЬ 18 СЕК...';
      recorder.start();
      setTimeout(() => recorder.stop(), LOOP_DURATION * 1000);
    });
  </script>
</body>
</html>
